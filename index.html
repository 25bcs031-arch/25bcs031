<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kanishka M — The Hand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#10100c;--ink:#f3efe3;--mute:#b9b4a3;--acid:#d6ff1f;--g:'Space Grotesk',system-ui,sans-serif;--s:'Instrument Serif',Georgia,serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10100c}}
:root[data-theme="dark"]{--bg:#10100c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 85%,#2a2f10,var(--bg) 62%);color:var(--ink);font-family:var(--g);overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
header{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);left:5vw;right:5vw;display:flex;justify-content:space-between;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);pointer-events:none}
header b{color:var(--acid);font-weight:500}
#nav{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 4vw}
#nav button{font:500 13px var(--g);color:var(--ink);background:#ffffff0f;border:1px solid #f3efe355;border-radius:99px;padding:8px 14px;cursor:pointer;transition:.2s}
#nav button:hover,#nav button:focus-visible,#nav button.h{background:var(--acid);color:#14140f;border-color:var(--acid);outline:none}
#dt{position:fixed;inset:0;display:none;place-items:center;background:#0a0a07d9;z-index:5;padding:5vw}
#dt.o{display:grid}
.sheet{width:min(620px,100%);max-height:84vh;overflow:auto;background:var(--ink);color:#14140f;border-radius:6px;box-shadow:0 30px 80px #000a}
.sheet .top{background:var(--acid);padding:18px 24px;display:flex;justify-content:space-between;align-items:flex-start}
.sheet h2{margin:0;font-size:clamp(28px,6vw,44px);letter-spacing:-.02em;line-height:1}
.sheet h2 em{font-family:var(--s);font-weight:400}
.sheet .x{font:700 18px var(--g);background:#14140f;color:var(--acid);border:0;width:36px;height:36px;border-radius:50%;cursor:pointer;flex:none}
.sheet .bd{padding:20px 24px 26px;font-size:16px;line-height:1.55}
.sheet p{margin:0 0 12px}
.sheet ul{margin:0;padding:0;list-style:none;display:grid;gap:9px}
.sheet li{border-left:3px solid var(--acid);padding-left:12px;background:linear-gradient(90deg,#14140f0a,transparent)}
.sheet li small{display:block;color:#5c5a4c;font-size:13px}
.sheet a{color:#14140f;font-weight:700}
.hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 62px);text-align:center;font:italic 18px var(--s);color:var(--mute);pointer-events:none}
</style></head>
<body>
<header><span><b>KM</b> · Campaign deck</span><span>Portfolio 2026</span></header>
<canvas id="c"></canvas>
<p class="hint">Pick a card from the hand</p>
<nav id="nav" aria-label="Cards"></nav>
<div id="dt" role="dialog" aria-modal="true"><div class="sheet"><div class="top"><h2 id="dh"></h2><button class="x" id="dx" aria-label="Close">×</button></div><div class="bd" id="db"></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
var cert=[['Programming in Python','Coursera'],['C Programming with DSA Foundation','Coursera'],['Advanced Java Development','Coursera'],['Create a Supermarket App using Java OOP','Coursera'],['Preparing for AZ-900 Azure Fundamentals','Coursera'],['MongoDB Basics for Students — Skill Badge','ICT Academy · Skill-a-thon 2026'],['Celonis Foundations','Celonis Academy'],['Get Data Into Celonis','Celonis Academy'],['Process Mining: From Theory to Execution','Celonis Academy'],['Build Action Flows','Celonis Academy'],['Process Mining Audit Professional','Celonis Academy'],['Process Automation Concepts','Celonis Academy'],['Digital Application Fundamentals (STEM)','FutureSkills Prime, NASSCOM'],['Big Data Computing','NPTEL']];
var K=[
{n:'Languages',big:'Aa',s:['Tamil','English'],d:'<p>Tamil and English.</p>'},
{n:'Certificates',big:'14',s:['Coursera · Celonis','NPTEL · NASSCOM','ICT Academy'],d:'<ul>'+cert.map(function(c){return'<li>'+c[0]+'<small>'+c[1]+'</small></li>'}).join('')+'</ul>'},
{n:'Skills',big:'</>',s:['C · Python · HTML','Learning Java, DSA,','MongoDB, Azure'],d:'<p><b>Write:</b> C, Python, HTML.</p><p><b>Learning:</b> Java OOP, data structures, MongoDB, Azure fundamentals, big data, Celonis process mining.</p>'},
{n:'Profile',big:'KM',s:['Kanishka M','Coimbatore, Tamil Nadu','Sem 1 66% · Sem 2 71%'],d:'<p><b>Kanishka M</b>, student developer based in Coimbatore, Tamil Nadu.</p><p><b>Core skills:</b> C, Python, HTML.<br><b>Languages:</b> Tamil, English.<br><b>Academics:</b> Semester 1, 66%. Semester 2, 71%.<br><b>Courses:</b> 14 completed.</p>'},
{n:'About',big:'¶',s:['Strong programming and','web development skills,','built step by step.'],d:'<p>I want to develop strong programming and web development skills, gain practical experience, and build a successful career in the technology industry.</p><p>Alongside college I study Java, data structures, MongoDB, Azure and process mining through online courses.</p>'},
{n:'Projects',big:'{ }',s:['Supermarket App','Java OOP · Coursera','Celonis training'],d:'<ul><li>Supermarket App<small>Java OOP · guided project, Coursera</small></li><li>Advanced Java Development<small>Coursera</small></li><li>Process mining with Celonis<small>Six Celonis Academy courses, from loading data to action flows</small></li></ul>'},
{n:'Contact',big:'@',s:['kanishkamohanraj31','@gmail.com','8610828902'],d:'<p>Open to internships and learning opportunities.</p><p><a href="mailto:kanishkamohanraj31@gmail.com">kanishkamohanraj31@gmail.com</a><br><a href="tel:+918610828902">8610828902</a><br>Coimbatore, Tamil Nadu</p>'}
];
var M=3,STEP=14*Math.PI/180;
// UI
var nav=document.getElementById('nav'),dt=document.getElementById('dt'),dh=document.getElementById('dh'),db=document.getElementById('db');
K.forEach(function(k,i){var b=document.createElement('button');b.textContent=k.n;b.onclick=function(){open(i)};b.onmouseenter=function(){hov=i};b.onmouseleave=function(){hov=-1};k.b=b;nav.appendChild(b)});
function open(i){dh.innerHTML=K[i].n.replace(/^(\S+)/,'<em>$1</em>');db.innerHTML=K[i].d;dt.classList.add('o');document.getElementById('dx').focus()}
function close(){dt.classList.remove('o')}
document.getElementById('dx').onclick=close;dt.onclick=function(e){if(e.target===dt)close()};
addEventListener('keydown',function(e){if(e.key==='Escape')close()});
var hov=-1;
var R;try{R=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,alpha:true})}catch(e){document.getElementById('c').style.display='none';return}
R.setPixelRatio(Math.min(devicePixelRatio,2));
var S=new THREE.Scene(),cam=new THREE.PerspectiveCamera(40,1,.1,100);
function rs(){R.setSize(innerWidth,innerHeight,false);var a=innerWidth/innerHeight;cam.aspect=a;cam.position.set(0,1.2,Math.max(17,9/(Math.tan(20*Math.PI/180)*a)));cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();
var hand=new THREE.Group();hand.position.y=-5;S.add(hand);
var W=4,Hh=6,D=3.2,cards=[],tex=function(c){var t=new THREE.CanvasTexture(c);t.anisotropy=4;return t};
function wait(){var f=document.fonts;return f&&f.load?Promise.race([Promise.all([f.load('700 40px "Space Grotesk"'),f.load('italic 40px "Instrument Serif"')]),new Promise(function(r){setTimeout(r,1200)})]):Promise.resolve()}
function face(i){var c=document.createElement('canvas');c.width=512;c.height=768;var x=c.getContext('2d'),dark=(i%2===0)&&i!==M,bg=dark?'#17170f':'#f3efe3',fg=dark?'#f3efe3':'#14140f',ac=dark?'#d6ff1f':'#14140f',k=K[i];
x.fillStyle=bg;x.fillRect(0,0,512,768);x.strokeStyle=ac;x.lineWidth=3;x.strokeRect(18,18,476,732);
var left=i<M,mid=i===M;x.textAlign=mid?'center':(left?'left':'right');var tx=mid?256:(left?44:468);
x.fillStyle=ac;x.font='500 22px "Space Grotesk",sans-serif';x.fillText(('0'+(i+1))+' / 07',tx,66);
x.fillStyle=fg;x.font='700 54px "Space Grotesk",sans-serif';x.fillText(k.n,tx,128);
x.textAlign='center';x.fillStyle=dark?'#d6ff1f':'#14140f';x.font='italic 190px "Instrument Serif",Georgia,serif';x.fillText(k.big,256,470);
x.fillStyle=fg;x.font='500 25px "Space Grotesk",sans-serif';k.s.forEach(function(l,j){x.fillText(l,256,590+j*36)});
x.fillStyle=ac;x.fillRect(44,712,424,3);return c}
function plate(){var c=document.createElement('canvas');c.width=800;c.height=288;var x=c.getContext('2d');x.fillStyle='#d6ff1f';x.fillRect(0,0,800,288);x.strokeStyle='#14140f';x.lineWidth=6;x.strokeRect(8,8,784,272);
x.fillStyle='#14140f';x.font='500 24px "Space Grotesk",sans-serif';x.fillText('CAMPAIGN NO. 01 — PORTFOLIO 2026',34,56);
x.font='700 100px "Space Grotesk",sans-serif';x.fillText('KANISHKA M',34,168);
x.font='italic 38px "Instrument Serif",Georgia,serif';x.fillText('Student developer · C, Python, HTML · Coimbatore',34,238);return c}
function build(){
K.forEach(function(k,i){var g=new THREE.Group(),inner=new THREE.Group();
var sh=new THREE.Mesh(new THREE.PlaneGeometry(W+.18,Hh+.18),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.4}));sh.position.set(.05,-.06,-.02);
var m=new THREE.Mesh(new THREE.PlaneGeometry(W,Hh),new THREE.MeshBasicMaterial({map:tex(face(i))}));m.userData.i=i;
inner.add(sh,m);inner.position.y=D+Hh/2;g.add(inner);g.position.z=-Math.abs(i-M)*.06;hand.add(g);cards.push({g:g,inner:inner,m:m,lift:0})});
var p=new THREE.Mesh(new THREE.PlaneGeometry(5.2,1.872),new THREE.MeshBasicMaterial({map:tex(plate())}));p.position.set(0,D+2.5,.8);p.userData.i=M;hand.add(p);cards.plate=p;
var pin=new THREE.Mesh(new THREE.TorusGeometry(.32,.07,10,32),new THREE.MeshBasicMaterial({color:0xd6ff1f}));pin.position.z=.2;hand.add(pin);
var t0=performance.now();loop(t0)}
var mx=0,my=0,ray=new THREE.Raycaster(),mv=new THREE.Vector2(),sp=0,hit=-1;
var cv=document.getElementById('c');
cv.addEventListener('pointermove',function(e){mx=e.clientX/innerWidth*2-1;my=e.clientY/innerHeight*2-1;mv.set(mx,-my);pick()});
cv.addEventListener('pointerdown',function(e){mv.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight*2-1));pick();if(hit>=0)open(hit)});
function pick(){if(!cards.length)return;ray.setFromCamera(mv,cam);var h=ray.intersectObjects([cards.plate].concat(cards.map(function(c){return c.m})),false);hit=h.length?h[0].object.userData.i:-1;hov=hit;cv.style.cursor=hit>=0?'pointer':'default'}
var e3=function(x){var c=1.4;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
function loop(t0){requestAnimationFrame(function(){loop(t0)});
var s=Math.min(1,(performance.now()-t0-300)/1500);sp=s<=0?0:e3(s);
cards.forEach(function(c,i){c.g.rotation.z=-(i-M)*STEP*sp;c.lift+=((hov===i&&i!==M||(hov===M&&i===M)?.45:0)-c.lift)*.15;c.inner.position.y=D+Hh/2+c.lift;K[i].b.classList.toggle('h',hov===i)});
hand.rotation.y+=(mx*.18-hand.rotation.y)*.06;hand.rotation.x+=(my*.06-hand.rotation.x)*.06;
cam.lookAt(0,1,0);R.render(S,cam)}
wait().then(build,build);
})();
</script>
</body></html>
